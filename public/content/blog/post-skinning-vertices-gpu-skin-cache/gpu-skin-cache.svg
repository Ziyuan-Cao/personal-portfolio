<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">Obtaining post-skinning vertices from GPU Skin Cache</title><desc id="d">Bone and morph inputs flow through a compute skinning pass into cached position and tangent buffers.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1115"/><stop offset="1" stop-color="#20242b"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#f5c85b"/><stop offset="1" stop-color="#6ad4c8"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="96" fill="#6ad4c8" font-family="Arial" font-size="20" letter-spacing="5">POST-SKINNING DATA</text><text x="70" y="145" fill="#f5f2e8" font-family="Arial" font-size="38" font-weight="700">Read the result after deformation—not before it</text>
  <g font-family="Arial"><g fill="#171a20" stroke="#4e5966"><rect x="80" y="250" width="230" height="92" rx="18"/><rect x="80" y="382" width="230" height="92" rx="18"/><rect x="440" y="290" width="300" height="150" rx="24" stroke="url(#g)" stroke-width="3"/><rect x="870" y="250" width="290" height="92" rx="18"/><rect x="870" y="382" width="290" height="92" rx="18"/></g>
  <g fill="#f5f2e8" font-size="20"><text x="111" y="286">Reference positions</text><text x="111" y="418">Bones · weights · morphs</text><text x="487" y="344" font-size="25">GPU Skin Cache</text><text x="487" y="380" fill="#aaa" font-size="16">compute deformation pass</text><text x="902" y="286">Current position buffer</text><text x="902" y="418">Tangent / previous position</text></g></g>
  <g stroke="#f5c85b" stroke-width="4" fill="none"><path d="M310 296h130"/><path d="M310 428h130"/><path d="M740 334h130"/><path d="M740 402h130"/></g><g fill="#f5c85b"><path d="m428 287 14 9-14 9z"/><path d="m428 419 14 9-14 9z"/><path d="m858 325 14 9-14 9z"/><path d="m858 393 14 9-14 9z"/></g>
  <text x="70" y="584" fill="#aaa5ad" font-family="Arial" font-size="17">Synchronization, section offsets, buffer lifetime, and vertex-factory identity are part of the data contract.</text>
