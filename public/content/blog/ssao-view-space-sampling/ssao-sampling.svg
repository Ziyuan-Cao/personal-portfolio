<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SSAO view-space sampling</title>
  <desc id="desc">Hemisphere samples around a visible surface project into a depth buffer where closer scene geometry marks a sample as occluded.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0c1014"/>
      <stop offset="1" stop-color="#252027"/>
    </linearGradient>
    <linearGradient id="surface" x2="1">
      <stop stop-color="#35323a"/>
      <stop offset="1" stop-color="#1c2025"/>
    </linearGradient>
    <radialGradient id="field">
      <stop stop-color="#6ad4c8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#6ad4c8" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ad4c8"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <text x="70" y="84" fill="#f5c85b" font-family="Arial, sans-serif" font-size="18" letter-spacing="5">SCREEN-SPACE AMBIENT OCCLUSION</text>
  <text x="70" y="133" fill="#f5f2e8" font-family="Arial, sans-serif" font-size="39" font-weight="700">Sample in view space. Compare in the depth buffer.</text>
  <g transform="translate(55 172)">
    <path d="M70 430 C190 382 340 406 470 350 C550 315 630 286 690 305 L690 470 L70 470 Z" fill="url(#surface)" stroke="#5c5861" stroke-width="2"/>
    <path d="M410 380 Q505 200 600 380" fill="url(#field)" stroke="#6ad4c8" stroke-width="2" stroke-dasharray="8 10"/>
    <line x1="505" y1="380" x2="505" y2="190" stroke="#f5c85b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="522" y="220" fill="#f5c85b" font-family="Arial, sans-serif" font-size="18">normal</text>
    <circle cx="505" cy="380" r="9" fill="#fff7d0"/>
    <g fill="#6ad4c8">
      <circle cx="442" cy="330" r="8"/>
      <circle cx="474" cy="276" r="8"/>
      <circle cx="535" cy="254" r="8"/>
      <circle cx="574" cy="312" r="8"/>
      <circle cx="520" cy="334" r="8"/>
    </g>
    <g stroke="#6ad4c8" stroke-width="2" stroke-dasharray="5 7">
      <line x1="442" y1="330" x2="897" y2="225"/>
      <line x1="474" y1="276" x2="955" y2="194"/>
      <line x1="535" y1="254" x2="1014" y2="271"/>
      <line x1="574" y1="312" x2="1065" y2="341"/>
    </g>
    <text x="350" y="515" fill="#aaa6ad" font-family="Arial, sans-serif" font-size="17">View-space hemisphere around the current pixel</text>
  </g>
  <g transform="translate(840 188)" font-family="Arial, sans-serif">
    <rect width="360" height="386" rx="22" fill="#15181d" stroke="#4f4b55"/>
    <text x="28" y="46" fill="#6ad4c8" font-size="16" letter-spacing="3">DEPTH LOOKUP</text>
    <rect x="28" y="74" width="304" height="190" rx="12" fill="#20242a" stroke="#5b5760"/>
    <path d="M28 194 C96 168 142 208 205 160 C246 130 285 140 332 116 L332 264 L28 264 Z" fill="#403c45"/>
    <circle cx="115" cy="149" r="9" fill="#f5c85b"/>
    <circle cx="213" cy="143" r="9" fill="#6ad4c8"/>
    <line x1="115" y1="149" x2="115" y2="194" stroke="#f5c85b" stroke-width="3"/>
    <line x1="213" y1="143" x2="213" y2="158" stroke="#6ad4c8" stroke-width="3"/>
    <text x="28" y="302" fill="#f5c85b" font-size="18" font-weight="700">sceneZ &lt; sampleZ</text>
    <text x="28" y="329" fill="#aaa6ad" font-size="16">closer geometry occludes</text>
    <text x="28" y="365" fill="#f5f2e8" font-size="18">visibility = 1 - weighted hits</text>
  </g>
</svg>
