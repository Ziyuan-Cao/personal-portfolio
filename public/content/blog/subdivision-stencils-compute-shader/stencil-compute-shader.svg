<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Subdivision stencil compute shader</title><desc id="d">One GPU thread gathers control vertices using stencil arrays and writes a refined vertex.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1115"/><stop offset="1" stop-color="#20242b"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="94" fill="#6ad4c8" font-family="Arial" font-size="20" letter-spacing="5">COMPUTE EVALUATION</text><text x="70" y="144" fill="#f5f2e8" font-family="Arial" font-size="40" font-weight="700">One thread, one refined vertex</text>
  <g font-family="Arial" text-anchor="middle"><g fill="#171a20" stroke="#53606c"><rect x="70" y="274" width="220" height="154" rx="20"/><rect x="370" y="244" width="300" height="214" rx="24" stroke="#f5c85b" stroke-width="3"/><rect x="760" y="274" width="220" height="154" rx="20"/><rect x="1050" y="274" width="160" height="154" rx="20"/></g><g fill="#f5f2e8"><text x="180" y="320" font-size="21">Stencil buffers</text><text x="180" y="355" fill="#aaa" font-size="15">size · offset</text><text x="180" y="380" fill="#aaa" font-size="15">index · weight</text><text x="520" y="295" font-size="22">Thread i</text><text x="520" y="338" fill="#aaa" font-size="15">read span</text><text x="520" y="371" fill="#aaa" font-size="15">gather attributes</text><text x="520" y="404" fill="#aaa" font-size="15">weighted accumulate</text><text x="870" y="320" font-size="21">Control vertices</text><text x="870" y="360" fill="#aaa" font-size="15">position · tangent</text><text x="870" y="386" fill="#aaa" font-size="15">UV · color</text><text x="1130" y="320" font-size="21">Output</text><text x="1130" y="360" fill="#aaa" font-size="15">vertex i</text></g></g>
