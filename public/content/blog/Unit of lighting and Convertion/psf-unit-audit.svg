<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">Lighting units and conversion map</title>
  <desc id="d">Luminous flux in lumens connects to candela through solid angle, to lux through distance and incidence angle, and to luminance through projected area or surface reflectance.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1115"/><stop offset="1" stop-color="#20242b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6ad4c8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="88" fill="#6ad4c8" font-family="Arial" font-size="20" letter-spacing="5">LIGHTING FUNDAMENTALS</text>
  <text x="70" y="142" fill="#f5f2e8" font-family="Arial" font-size="42" font-weight="700">Units describe different parts of light</text>

  <g font-family="Arial" text-anchor="middle">
    <g fill="#171a20" stroke="#56616d" stroke-width="2">
      <rect x="70" y="270" width="240" height="128" rx="18"/>
      <rect x="520" y="270" width="240" height="128" rx="18"/>
      <rect x="970" y="270" width="240" height="128" rx="18"/>
      <rect x="520" y="510" width="240" height="128" rx="18"/>
    </g>
    <g fill="#f5f2e8">
      <text x="190" y="316" font-size="18">Luminous flux</text><text x="190" y="362" fill="#f5c85b" font-family="Cambria Math,serif" font-size="27">Φ · lm</text>
      <text x="640" y="316" font-size="18">Luminous intensity</text><text x="640" y="362" fill="#f5c85b" font-family="Cambria Math,serif" font-size="27">I · cd</text>
      <text x="1090" y="316" font-size="18">Illuminance</text><text x="1090" y="362" fill="#f5c85b" font-family="Cambria Math,serif" font-size="27">E · lx</text>
      <text x="640" y="556" font-size="18">Luminance</text><text x="640" y="602" fill="#f5c85b" font-family="Cambria Math,serif" font-size="27">L · cd/m²</text>
    </g>
  </g>

  <g fill="none" stroke="#6ad4c8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M310 334H500"/>
    <path d="M760 334H950"/>
    <path d="M640 398V490"/>
  </g>
  <g fill="#aaa5ad" font-family="Cambria Math,serif" font-size="20" text-anchor="middle">
    <text x="405" y="315">÷ Ω</text>
    <text x="855" y="315">× cosθ / r²</text>
    <text x="686" y="457">÷ Aₚ</text>
  </g>

  <text x="70" y="666" fill="#aaa5ad" font-family="Arial" font-size="17">W measures radiant power; lm, cd, lx, and cd/m² are weighted for human vision.</text>
</svg>
