<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Anatomy of an IES photometric file</title><desc id="d">Metadata, angles, and candela samples become a directional intensity distribution.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1115"/><stop offset="1" stop-color="#20242b"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="94" fill="#6ad4c8" font-family="Arial" font-size="20" letter-spacing="5">PHOTOMETRY</text><text x="70" y="144" fill="#f5f2e8" font-family="Arial" font-size="40" font-weight="700">An IES file is measured intensity over direction</text>
  <g font-family="monospace" font-size="18"><rect x="78" y="218" width="490" height="356" rx="20" fill="#15181d" stroke="#4f5862"/><text x="118" y="270" fill="#f5c85b">IESNA:LM-63-2002</text><text x="118" y="310" fill="#aaa5ad">[TEST] laboratory measurement</text><text x="118" y="350" fill="#aaa5ad">TILT=NONE</text><text x="118" y="390" fill="#f5f2e8">1 1000 1.0 19 5 1 ...</text><text x="118" y="430" fill="#6ad4c8">0 5 10 ... 90 ... 180</text><text x="118" y="470" fill="#6ad4c8">0 45 90 135 180</text><text x="118" y="510" fill="#f5f2e8">1240 1215 1170 ... candela</text></g>
  <g transform="translate(830 390)"><circle r="158" fill="none" stroke="#404954" stroke-width="2"/><circle r="92" fill="none" stroke="#404954"/><path d="M0-160 C70-110 112-30 75 80 C42 168-42 168-75 80 C-112-30-70-110 0-160Z" fill="#f5c85b" opacity=".2" stroke="#f5c85b" stroke-width="4"/><path d="M-190 0H190M0-190V190" stroke="#404954"/><circle r="9" fill="#f5c85b"/></g><path d="M570 396h90" stroke="#6ad4c8" stroke-width="4"/><path d="m648 387 14 9-14 9z" fill="#6ad4c8"/>
  <text x="730" y="620" fill="#aaa5ad" font-family="Arial" font-size="16">Candela is directional luminous intensity—not a grayscale cookie.</text>
</svg>
