<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">How this portfolio works</title>
  <desc id="description">A visual system map showing content and news sources flowing through GitHub Actions to GitHub Pages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#171719"/>
      <stop offset="1" stop-color="#252221"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop stop-color="#ffdb70"/>
      <stop offset="1" stop-color="#e7a955"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#d6b461"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <circle cx="1070" cy="60" r="230" fill="#ffdb70" opacity=".035"/>
  <circle cx="90" cy="650" r="260" fill="#ffdb70" opacity=".025"/>
  <text x="72" y="92" fill="#f5f5f5" font-family="Poppins,Arial,sans-serif" font-size="42" font-weight="600">How this site works</text>
  <text x="72" y="133" fill="#aaa" font-family="Poppins,Arial,sans-serif" font-size="20">content in &#8226; automated out &#8226; static by design</text>
  <g fill="none" stroke="#d6b461" stroke-width="4" marker-end="url(#arrow)" opacity=".8">
    <path d="M330 282H455"/>
    <path d="M330 478C405 478 390 390 455 390"/>
    <path d="M745 346H870"/>
  </g>
  <g filter="url(#shadow)" font-family="Poppins,Arial,sans-serif">
    <g>
      <rect x="72" y="210" width="258" height="144" rx="24" fill="#252527" stroke="#444"/>
      <rect x="92" y="232" width="54" height="54" rx="16" fill="#34302a"/>
      <path d="M108 249h22m-22 10h16m-16 10h20" stroke="#ffdb70" stroke-width="4" stroke-linecap="round"/>
      <text x="164" y="260" fill="#f5f5f5" font-size="23" font-weight="600">Site content</text>
      <text x="92" y="318" fill="#aaa" font-size="17">Projects &#8226; writing &#8226; images</text>
    </g>
    <g>
      <rect x="72" y="406" width="258" height="144" rx="24" fill="#252527" stroke="#444"/>
      <rect x="92" y="428" width="54" height="54" rx="16" fill="#34302a"/>
      <circle cx="119" cy="455" r="15" fill="none" stroke="#ffdb70" stroke-width="4"/>
      <path d="M119 432v8m0 30v8m-23-23h8m30 0h8" stroke="#ffdb70" stroke-width="4" stroke-linecap="round"/>
      <text x="164" y="456" fill="#f5f5f5" font-size="23" font-weight="600">News sources</text>
      <text x="92" y="514" fill="#aaa" font-size="17">Feeds &#8226; sites &#8226; articles</text>
    </g>
    <g>
      <rect x="455" y="250" width="290" height="190" rx="28" fill="#2b2824" stroke="url(#gold)" stroke-width="2"/>
      <circle cx="600" cy="307" r="29" fill="#ffdb70" opacity=".14"/>
      <path d="M581 306h38m-19-19v38" stroke="#ffdb70" stroke-width="5" stroke-linecap="round"/>
      <text x="600" y="367" fill="#f5f5f5" font-size="27" font-weight="600" text-anchor="middle">GitHub Actions</text>
      <text x="600" y="402" fill="#b9b9b9" font-size="17" text-anchor="middle">check &#8226; collect &#8226; package</text>
    </g>
    <g>
      <rect x="870" y="270" width="258" height="154" rx="26" fill="#252527" stroke="#444"/>
      <rect x="890" y="292" width="54" height="54" rx="16" fill="#34302a"/>
      <path d="M905 328v-21l12-8 12 8v21m-30 0h36" fill="none" stroke="#ffdb70" stroke-width="4" stroke-linejoin="round"/>
      <text x="962" y="321" fill="#f5f5f5" font-size="23" font-weight="600">GitHub Pages</text>
      <text x="890" y="385" fill="#aaa" font-size="17">The live static portfolio</text>
    </g>
  </g>
  <rect x="72" y="598" width="1056" height="1" fill="#444"/>
  <text x="72" y="635" fill="#8e8e8e" font-family="Poppins,Arial,sans-serif" font-size="16">ZIYUAN CAO &#8212; PORTFOLIO SYSTEM NOTES / 001</text>
