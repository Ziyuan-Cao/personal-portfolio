<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Unreal standard bloom versus PSF glare</title><desc id="d">A mip pyramid and multi-scale Gaussian reconstruction are contrasted with convolution by a calibrated angular kernel.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111014"/><stop offset="1" stop-color="#242126"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="94" fill="#f5c85b" font-family="Arial" font-size="20" letter-spacing="5">BLOOM MODELS</text><text x="70" y="144" fill="#f5f2e8" font-family="Arial" font-size="40" font-weight="700">Fast multi-scale blur or explicit lens response?</text><path d="M640 205v400" stroke="#4c484f"/>
  <g font-family="Arial"><text x="110" y="230" fill="#6ad4c8" font-size="25" font-weight="700">Standard bloom</text><text x="718" y="230" fill="#f5c85b" font-size="25" font-weight="700">PSF glare</text>
  <g fill="#17191e" stroke="#4e5660"><rect x="105" y="278" width="190" height="116" rx="16"/><rect x="330" y="302" width="145" height="92" rx="16"/><rect x="510" y="326" width="90" height="68" rx="14"/></g><g fill="#f5f2e8" text-anchor="middle"><text x="200" y="330" font-size="18">bright pass</text><text x="200" y="360" fill="#aaa" font-size="14">½ resolution</text><text x="402" y="342" font-size="18">blur</text><text x="402" y="370" fill="#aaa" font-size="14">⅛ resolution</text><text x="555" y="365" font-size="17">blur</text></g>
  <rect x="716" y="278" width="176" height="116" rx="16" fill="#17191e" stroke="#4e5660"/><circle cx="1015" cy="336" r="105" fill="none" stroke="#f5c85b" stroke-width="3"/><circle cx="1015" cy="336" r="48" fill="#f5c85b" opacity=".1"/><circle cx="1015" cy="336" r="7" fill="#fff2b8"/><text x="804" y="330" fill="#f5f2e8" text-anchor="middle" font-size="18">HDR source</text><text x="804" y="360" fill="#aaa" text-anchor="middle" font-size="14">radiometric input</text>
  <text x="1020" y="480" fill="#aaa5ad" text-anchor="middle" font-size="16">fixed angular distribution</text><text x="352" y="480" fill="#aaa5ad" text-anchor="middle" font-size="16">weighted, performance-oriented scales</text></g>
  <text x="70" y="620" fill="#aaa5ad" font-family="Arial" font-size="17">Neither model is universally “better.” They optimize different contracts: art direction and speed versus explicit spread and energy.</text>
</svg>
