<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">Rendering research skills map</title><desc id="d">A central verification loop connects engine tracing, geometry processing, GPU compute, and photometric modeling.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1115"/><stop offset="1" stop-color="#20242b"/></linearGradient></defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="92" fill="#6ad4c8" font-family="Arial" font-size="20" letter-spacing="5">EXPERIENCE SYNTHESIS</text>
  <text x="70" y="143" fill="#f5f2e8" font-family="Arial" font-size="40" font-weight="700">From paper equations to frame-captured evidence</text>
  <g font-family="Arial" text-anchor="middle">
    <g fill="#171a20" stroke="#56616d" stroke-width="2">
      <rect x="70" y="245" width="245" height="120" rx="18"/><rect x="965" y="245" width="245" height="120" rx="18"/>
      <rect x="70" y="485" width="245" height="120" rx="18"/><rect x="965" y="485" width="245" height="120" rx="18"/>
      <circle cx="640" cy="425" r="145" stroke="#f5c85b" stroke-width="3"/>
    </g>
    <g fill="#f5f2e8"><text x="192" y="292" font-size="21">Engine tracing</text><text x="192" y="326" fill="#aaa5ad" font-size="15">owners, threads, passes</text>
      <text x="1087" y="292" font-size="21">Geometry processing</text><text x="1087" y="326" fill="#aaa5ad" font-size="15">topology, seams, stencils</text>
      <text x="192" y="532" font-size="21">GPU compute</text><text x="192" y="566" fill="#aaa5ad" font-size="15">buffers, hazards, profiling</text>
      <text x="1087" y="532" font-size="21">Light transport</text><text x="1087" y="566" fill="#aaa5ad" font-size="15">angles, units, energy</text>
      <text x="640" y="400" font-size="25" font-weight="700">Verification loop</text><text x="640" y="438" fill="#f5c85b" font-size="17">model - implement - measure</text><text x="640" y="470" fill="#aaa5ad" font-size="15">state assumptions explicitly</text>
    </g>
  </g>
  <g stroke="#6ad4c8" stroke-width="3" fill="none"><path d="M315 305C430 305 450 350 500 370"/><path d="M965 305C850 305 830 350 780 370"/><path d="M315 545C430 545 450 500 500 480"/><path d="M965 545C850 545 830 500 780 480"/></g>
