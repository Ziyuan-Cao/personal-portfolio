  <rect width="1280" height="720" fill="url(#bg)"/><circle cx="1060" cy="110" r="210" fill="#f5c85b" opacity=".055"/>
  <text x="72" y="96" fill="#f5c85b" font-family="Arial" font-size="20" letter-spacing="5">RENDERING PATH</text><text x="72" y="145" fill="#f5f2e8" font-family="Arial" font-size="38" font-weight="700">Skeletal mesh data, from asset to draw</text>
  <g font-family="Arial" text-anchor="middle"><g fill="#18191d" stroke="#57535b"><rect x="70" y="300" width="190" height="112" rx="18"/><rect x="304" y="300" width="190" height="112" rx="18"/><rect x="538" y="300" width="190" height="112" rx="18"/><rect x="772" y="300" width="190" height="112" rx="18"/><rect x="1006" y="300" width="190" height="112" rx="18"/></g>
  <g fill="#f5f2e8" font-size="19"><text x="165" y="348">Skeletal Mesh</text><text x="165" y="378" fill="#aaa5ad" font-size="14">LOD · sections · bones</text><text x="399" y="348">Render Data</text><text x="399" y="378" fill="#aaa5ad" font-size="14">vertex + index buffers</text><text x="633" y="348">Vertex Factory</text><text x="633" y="378" fill="#aaa5ad" font-size="14">stream interpretation</text><text x="867" y="348">Mesh Batch</text><text x="867" y="378" fill="#aaa5ad" font-size="14">one draw description</text><text x="1101" y="348">Draw Command</text><text x="1101" y="378" fill="#aaa5ad" font-size="14">pipeline-ready state</text></g></g>
