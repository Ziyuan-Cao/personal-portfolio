<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">UE4 skeletal mesh rendering data path</title><desc id="d">A sequence from skeletal mesh asset through render data, vertex factory, mesh batch, mesh draw command, and GPU.</desc>
