<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">OpenSubdiv stencil tables</title><desc id="d">A refined vertex is shown as a weighted sum of coarse control vertices, stored in size, offset, index, and weight arrays.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111014"/><stop offset="1" stop-color="#242126"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="94" fill="#f5c85b" font-family="Arial" font-size="20" letter-spacing="5">OPENSUBDIV</text><text x="70" y="144" fill="#f5f2e8" font-family="Arial" font-size="40" font-weight="700">A stencil is a sparse weighted recipe</text>
  <g stroke="#625d66" stroke-width="2" fill="none"><path d="M170 315 290 235 410 315 290 425Z"/><path d="m170 315 240 0M290 235v190"/></g><g fill="#6ad4c8" stroke="#d9fffa" stroke-width="2"><circle cx="170" cy="315" r="13"/><circle cx="290" cy="235" r="13"/><circle cx="410" cy="315" r="13"/><circle cx="290" cy="425" r="13"/></g><circle cx="290" cy="315" r="17" fill="#f5c85b" stroke="#fff2b8" stroke-width="3"/>
  <text x="520" y="290" fill="#f5f2e8" font-family="Cambria Math,serif" font-size="34">v′ = Σ wⱼ · v[indexⱼ]</text><text x="520" y="332" fill="#aaa5ad" font-family="Arial" font-size="17">one output vertex, a variable-length span of inputs</text>
  <g font-family="monospace" font-size="18"><text x="520" y="410" fill="#f5c85b">sizes</text><text x="650" y="410" fill="#f5f2e8">[ 4, 3, 6, … ]</text><text x="520" y="448" fill="#f5c85b">offsets</text><text x="650" y="448" fill="#f5f2e8">[ 0, 4, 7, … ]</text><text x="520" y="486" fill="#f5c85b">indices</text><text x="650" y="486" fill="#f5f2e8">[ 8, 9, 14, 15, … ]</text><text x="520" y="524" fill="#f5c85b">weights</text><text x="650" y="524" fill="#f5f2e8">[ .125, .375, .375, .125, … ]</text></g>
</svg>
