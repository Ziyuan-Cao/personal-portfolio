<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Angular PSF glare pipeline</title><desc id="d">Angular PSF components are integrated into an energy-normalized texture and accumulated as screen-space glare.</desc><defs><radialGradient id="psf"><stop stop-color="#fffbd2"/><stop offset=".05" stop-color="#f5c85b" stop-opacity=".9"/><stop offset=".28" stop-color="#ff9a87" stop-opacity=".24"/><stop offset=".7" stop-color="#6ad4c8" stop-opacity=".08"/><stop offset="1" stop-color="#6ad4c8" stop-opacity="0"/></radialGradient><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1014"/><stop offset="1" stop-color="#242126"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/><text x="70" y="94" fill="#f5c85b" font-family="Arial" font-size="20" letter-spacing="5">ANGULAR PSF GLARE</text><text x="70" y="144" fill="#f5f2e8" font-family="Arial" font-size="40" font-weight="700">From angular energy to runtime luminance</text><circle cx="330" cy="390" r="210" fill="url(#psf)"/><circle cx="330" cy="390" r="6" fill="#fff"/><path d="M330 390 485 300" stroke="#f5c85b" stroke-width="3"/><text x="435" y="326" fill="#f5c85b" font-family="Arial" font-size="20">θ</text><g font-family="Arial"><rect x="650" y="236" width="500" height="305" rx="24" fill="#17191e" stroke="#54515a"/><text x="700" y="292" fill="#6ad4c8" font-size="17">1 · generate</text><text x="700" y="328" fill="#f5f2e8" font-size="22">angle → core + corona + halo</text><text x="700" y="382" fill="#6ad4c8" font-size="17">2 · normalize</text><text x="700" y="418" fill="#f5f2e8" font-size="22">texel energy → density per steradian</text><text x="700" y="472" fill="#6ad4c8" font-size="17">3 · accumulate</text><text x="700" y="508" fill="#f5f2e8" font-size="22">source luminance → screen-space glare</text></g></svg>
