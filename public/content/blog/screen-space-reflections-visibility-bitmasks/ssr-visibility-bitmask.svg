<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Screen-space reflection and visibility-bitmask methods</title>
  <desc id="desc">A reflection ray projects through visible depth samples on the left, while angular sectors record finite-thickness visibility on the right.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0c1014"/>
      <stop offset="1" stop-color="#262028"/>
    </linearGradient>
    <linearGradient id="surface" x2="1">
      <stop stop-color="#45414a"/>
      <stop offset="1" stop-color="#20242a"/>
    </linearGradient>
    <linearGradient id="ray" x2="1">
      <stop stop-color="#f5c85b"/>
      <stop offset="1" stop-color="#6ad4c8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ad4c8"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <text x="70" y="84" fill="#f5c85b" font-family="Arial, sans-serif" font-size="18" letter-spacing="5">SCREEN-SPACE VISIBILITY</text>
  <text x="70" y="133" fill="#f5f2e8" font-family="Arial, sans-serif" font-size="39" font-weight="700">One reflected ray. Thirty-two angular sectors.</text>
  <g transform="translate(62 178)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="560" height="455" rx="24" fill="#15181d" stroke="#4e4a54"/>
    <text x="30" y="46" fill="#6ad4c8" font-size="16" letter-spacing="3">MIRROR SSR</text>
    <path d="M42 358 C150 312 218 356 305 300 C386 248 457 254 520 206 L520 400 L42 400 Z" fill="url(#surface)" stroke="#5b5761" stroke-width="2"/>
    <circle cx="240" cy="329" r="9" fill="#fff7d0"/>
    <line x1="76" y1="410" x2="240" y2="329" stroke="#f5c85b" stroke-width="4"/>
    <line x1="240" y1="329" x2="474" y2="148" stroke="url(#ray)" stroke-width="4" marker-end="url(#arrow)" filter="url(#glow)"/>
    <line x1="310" y1="275" x2="310" y2="300" stroke="#6ad4c8" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="370" y1="228" x2="370" y2="258" stroke="#6ad4c8" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="432" y1="180" x2="432" y2="223" stroke="#6ad4c8" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="30" y="435" fill="#aaa6ad" font-size="16">First plausible depth crossing returns scene color.</text>
  </g>
  <g transform="translate(658 178)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="560" height="455" rx="24" fill="#15181d" stroke="#4e4a54"/>
    <text x="30" y="46" fill="#6ad4c8" font-size="16" letter-spacing="3">VISIBILITY BITMASK</text>
    <path d="M90 333 Q280 82 470 333" fill="none" stroke="#55515a" stroke-width="2"/>
    <g transform="translate(88 330) rotate(-57)">
      <rect x="0" y="0" width="16" height="62" rx="4" fill="#e06d62"/>
      <rect x="22" y="0" width="16" height="62" rx="4" fill="#e06d62"/>
      <rect x="44" y="0" width="16" height="62" rx="4" fill="#6ad4c8"/>
      <rect x="66" y="0" width="16" height="62" rx="4" fill="#6ad4c8"/>
      <rect x="88" y="0" width="16" height="62" rx="4" fill="#6ad4c8"/>
      <rect x="110" y="0" width="16" height="62" rx="4" fill="#e06d62"/>
      <rect x="132" y="0" width="16" height="62" rx="4" fill="#e06d62"/>
      <rect x="154" y="0" width="16" height="62" rx="4" fill="#e06d62"/>
      <rect x="176" y="0" width="16" height="62" rx="4" fill="#6ad4c8"/>
      <rect x="198" y="0" width="16" height="62" rx="4" fill="#6ad4c8"/>
      <rect x="220" y="0" width="16" height="62" rx="4" fill="#6ad4c8"/>
      <rect x="242" y="0" width="16" height="62" rx="4" fill="#6ad4c8"/>
      <rect x="264" y="0" width="16" height="62" rx="4" fill="#e06d62"/>
      <rect x="286" y="0" width="16" height="62" rx="4" fill="#e06d62"/>
      <rect x="308" y="0" width="16" height="62" rx="4" fill="#6ad4c8"/>
      <rect x="330" y="0" width="16" height="62" rx="4" fill="#6ad4c8"/>
    </g>
    <circle cx="280" cy="333" r="9" fill="#fff7d0"/>
    <line x1="280" y1="333" x2="280" y2="128" stroke="#f5c85b" stroke-width="3"/>
    <path d="M188 268 L205 208 L225 271 Z" fill="#e06d62" fill-opacity=".35" stroke="#e06d62" stroke-width="2"/>
    <path d="M355 273 L374 224 L392 285 Z" fill="#e06d62" fill-opacity=".35" stroke="#e06d62" stroke-width="2"/>
    <text x="30" y="401" fill="#e06d62" font-size="16">occupied</text>
    <text x="123" y="401" fill="#6ad4c8" font-size="16">visible</text>
    <text x="30" y="435" fill="#aaa6ad" font-size="16">Finite intervals leave directions open behind thin surfaces.</text>
  </g>
</svg>
