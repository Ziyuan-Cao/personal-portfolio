<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">UV seams and material boundaries in subdivision</title><desc id="d">Two mesh sections share a geometric edge but own duplicated vertices and independent face-varying data.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111014"/><stop offset="1" stop-color="#242126"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="94" fill="#f5c85b" font-family="Arial" font-size="20" letter-spacing="5">BOUNDARIES</text><text x="70" y="144" fill="#f5f2e8" font-family="Arial" font-size="40" font-weight="700">Same position does not mean same vertex</text>
  <g stroke-width="3"><path d="M150 520 350 230 590 520Z" fill="#23333a" stroke="#6ad4c8"/><path d="M610 520 850 230 1080 520Z" fill="#382d24" stroke="#f5c85b"/><path d="M590 520 600 290 610 520" fill="#dd6b58" stroke="#ff9a87"/></g>
  <g fill="#f5f2e8" font-family="Arial"><text x="212" y="562" font-size="21">Material section A</text><text x="805" y="562" font-size="21">Material section B</text><text x="485" y="228" font-size="18">duplicated edge</text><text x="450" y="256" fill="#aaa5ad" font-size="15">position can match while UV, normal, tangent,</text><text x="493" y="278" fill="#aaa5ad" font-size="15">material identity, and subdivision neighborhood differ</text></g>
  <path d="M600 300V470" stroke="#ff9a87" stroke-width="4" stroke-dasharray="8 10"/>
